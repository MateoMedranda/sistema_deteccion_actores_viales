[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "road-actor-detection-service"
version = "0.1.0"
description = "Secure microservice for single-image road actor detection"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.6,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "psutil>=6,<8",
  "scipy>=1.14,<2",
  "ultralytics>=8.3,<9",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "paddlepaddle>=3,<4",
  # The approved ALPR adapter uses the stable PaddleOCR 2.x `ocr()` API.  Version 3
  # pulls PaddleX/ModelScope, which imports PyTorch during OCR startup on Windows.
  "paddleocr>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "performance: mediciones de rendimiento reproducibles con un detector de prueba",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["specs*", "tests*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
"app.domain" = ["class_presentation.json"]
