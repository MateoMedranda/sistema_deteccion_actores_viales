openapi: 3.1.0
info:
  title: Road Actor Detection API
  version: 1.0.0
  description: >-
    Servicio protegido para analizar una única imagen vial y recuperar una visualización temporal
    con las detecciones anotadas.
servers:
  - url: /api
paths:
  /v1/detections/images:
    post:
      summary: Analiza una imagen vial
      operationId: analyzeImage
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Imagen JPEG o PNG dentro del límite configurado.
      responses:
        '200':
          description: Análisis completado, incluso cuando no se detectan actores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionResponse'
        '400':
          $ref: '#/components/responses/InvalidImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/UndecodableImage'
        '503':
          $ref: '#/components/responses/ModelUnavailable'
  /v1/detections/{requestId}/annotated-image:
    get:
      summary: Recupera una imagen anotada temporal
      operationId: getAnnotatedImage
      security:
        - ApiKeyAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Imagen anotada vigente.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ArtifactNotFound'
        '410':
          $ref: '#/components/responses/ArtifactExpired'
  /health/live:
    get:
      summary: Comprueba que el proceso está activo
      operationId: liveness
      responses:
        '200':
          description: Proceso activo.
  /health/ready:
    get:
      summary: Comprueba que el modelo está cargado y el servicio puede analizar imágenes
      operationId: readiness
      responses:
        '200':
          description: Servicio listo.
        '503':
          description: Servicio no listo.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    DetectionResponse:
      type: object
      required:
        - request_id
        - status
        - processing_time_ms
        - image
        - detections
        - annotated_image
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed]
        processing_time_ms:
          type: integer
          minimum: 0
        image:
          type: object
          required: [width, height, media_type]
          properties:
            width: { type: integer, minimum: 1 }
            height: { type: integer, minimum: 1 }
            media_type: { type: string, enum: [image/jpeg, image/png] }
        detections:
          type: array
          items:
            $ref: '#/components/schemas/Detection'
        annotated_image:
          type: object
          required: [url, media_type, expires_at]
          properties:
            url: { type: string, format: uri-reference }
            media_type: { type: string, enum: [image/jpeg] }
            expires_at: { type: string, format: date-time }
    Detection:
      type: object
      required: [detection_id, class_id, class_name, confidence, bbox]
      properties:
        detection_id: { type: integer, minimum: 1 }
        class_id: { type: integer, minimum: 0 }
        class_name: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        bbox:
          type: object
          required: [x_min, y_min, x_max, y_max]
          properties:
            x_min: { type: integer, minimum: 0 }
            y_min: { type: integer, minimum: 0 }
            x_max: { type: integer, minimum: 1 }
            y_max: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, format: uuid }
  responses:
    InvalidImage:
      description: El contenido no corresponde a una imagen válida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Falta una clave de API válida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    FileTooLarge:
      description: El archivo supera el límite configurado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMedia:
      description: El tipo de imagen no está permitido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UndecodableImage:
      description: La imagen no puede decodificarse de forma segura.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ModelUnavailable:
      description: El modelo no está listo para procesar solicitudes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ArtifactNotFound:
      description: No existe un artefacto para la solicitud indicada.
    ArtifactExpired:
      description: El artefacto temporal ya venció y fue eliminado.
