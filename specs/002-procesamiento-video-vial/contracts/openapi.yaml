openapi: 3.1.0
info:
  title: Road Actor Detection API - Video Jobs
  version: 2.0.0
  description: Servicio protegido para procesar temporalmente videos viales como trabajos asíncronos.
servers:
  - url: /api
paths:
  /v1/video-jobs:
    post:
      summary: Crea un trabajo de análisis de video
      operationId: createVideoJob
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [video]
              properties:
                video:
                  type: string
                  format: binary
                  description: Video MP4 con códec H.264 dentro de los límites configurados.
      responses:
        '202':
          description: Trabajo aceptado y encolado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoJobAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedVideo' }
        '422': { $ref: '#/components/responses/InvalidVideo' }
        '503': { $ref: '#/components/responses/QueueUnavailable' }
  /v1/video-jobs/{jobId}:
    get:
      summary: Consulta estado y resultado de un trabajo
      operationId: getVideoJob
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Estado actual del trabajo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoJobResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '410': { $ref: '#/components/responses/JobExpired' }
    delete:
      summary: Solicita cancelar un trabajo no terminal
      operationId: cancelVideoJob
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '202':
          description: Cancelación aceptada o aplicada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoJobResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409': { $ref: '#/components/responses/TerminalJob' }
        '410': { $ref: '#/components/responses/JobExpired' }
  /v1/video-jobs/{jobId}/detections:
    get:
      summary: Lista paginada de detecciones por fotograma
      operationId: listVideoJobDetections
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/JobId' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Página de detecciones del trabajo terminado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/JobNotFound' }
        '409': { $ref: '#/components/responses/ResultNotReady' }
        '410': { $ref: '#/components/responses/JobExpired' }
  /v1/video-jobs/{jobId}/annotated-video:
    get:
      summary: Recupera temporalmente el video anotado
      operationId: getAnnotatedVideo
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Video anotado vigente.
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ArtifactNotFound' }
        '410': { $ref: '#/components/responses/ArtifactExpired' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    VideoJobStatus:
      type: string
      enum: [queued, processing, completed, failed, cancelled]
    VideoJobAccepted:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/VideoJobStatus' }
        created_at: { type: string, format: date-time }
    VideoJobResponse:
      type: object
      required: [job_id, status, progress_percent, processed_frames, total_frames, created_at, expires_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/VideoJobStatus' }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        processed_frames: { type: integer, minimum: 0 }
        total_frames: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        error: { $ref: '#/components/schemas/PublicError' }
        result: { $ref: '#/components/schemas/VideoResult' }
    PublicError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    VideoResult:
      type: object
      required: [processing_time_ms, frame_count, summary_by_class, annotated_video]
      properties:
        processing_time_ms: { type: integer, minimum: 0 }
        frame_count: { type: integer, minimum: 1 }
        summary_by_class:
          type: array
          items: { $ref: '#/components/schemas/ClassSummary' }
        annotated_video: { $ref: '#/components/schemas/TemporaryVideo' }
    ClassSummary:
      type: object
      required: [class_id, class_name, detection_count, unique_track_count]
      properties:
        class_id: { type: integer, minimum: 0 }
        class_name: { type: string }
        detection_count: { type: integer, minimum: 0 }
        unique_track_count: { type: integer, minimum: 0 }
    TemporaryVideo:
      type: object
      required: [url, media_type, expires_at]
      properties:
        url: { type: string, format: uri-reference }
        media_type: { type: string, enum: [video/mp4] }
        expires_at: { type: string, format: date-time }
    DetectionPage:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FrameDetection' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    FrameDetection:
      type: object
      required: [frame_index, track_id, class_id, class_name, confidence, bbox]
      properties:
        frame_index: { type: integer, minimum: 0 }
        track_id: { type: integer, minimum: 1 }
        class_id: { type: integer, minimum: 0 }
        class_name: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        bbox:
          type: object
          required: [x_min, y_min, x_max, y_max]
          properties:
            x_min: { type: integer, minimum: 0 }
            y_min: { type: integer, minimum: 0 }
            x_max: { type: integer, minimum: 1 }
            y_max: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Falta una clave de API válida.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    FileTooLarge:
      description: El archivo supera el límite configurado.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnsupportedVideo:
      description: El contenedor o códec de video no está permitido.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InvalidVideo:
      description: El video no puede validarse de forma segura.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    QueueUnavailable:
      description: La cola temporal no está disponible.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    JobNotFound:
      description: No existe un trabajo accesible con el identificador indicado.
    JobExpired:
      description: El trabajo temporal venció y fue eliminado.
    TerminalJob:
      description: El trabajo ya alcanzó un estado terminal y no puede cancelarse.
    ResultNotReady:
      description: El resultado aún no está disponible.
    ArtifactNotFound:
      description: No existe video anotado para el trabajo.
    ArtifactExpired:
      description: El video anotado temporal venció y fue eliminado.
