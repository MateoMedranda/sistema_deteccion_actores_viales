openapi: 3.1.0
info:
  title: Road Actor Detection API - Line Counting
  version: 3.0.0
  description: Conteo temporal y direccional sobre detecciones de un video terminado.
servers:
  - url: /api
paths:
  /v1/video-jobs/{videoJobId}/count-jobs:
    post:
      summary: Crea un trabajo asíncrono de conteo
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VideoJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountJobCreateRequest'
      responses:
        '202':
          description: Trabajo aceptado
          content: { application/json: { schema: { $ref: '#/components/schemas/CountJobAccepted' } } }
        '400': { $ref: '#/components/responses/InvalidLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/count-jobs/{countJobId}:
    get:
      summary: Consulta progreso y totales acumulados
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CountJobId'
      responses:
        '200':
          description: Estado, progreso y resumen acumulado
          content: { application/json: { schema: { $ref: '#/components/schemas/CountJobResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/count-jobs/{countJobId}/events:
    get:
      summary: Lista eventos confirmados
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CountJobId'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Eventos ordenados por fotograma
          content: { application/json: { schema: { $ref: '#/components/schemas/CountEventPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/count-jobs/{countJobId}/annotated-video:
    get:
      summary: Recupera el video temporal con línea y contadores
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CountJobId'
      responses:
        '200':
          description: Video MP4 anotado
          content: { video/mp4: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    VideoJobId: { name: videoJobId, in: path, required: true, schema: { type: string, format: uuid } }
    CountJobId: { name: countJobId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    InvalidLine:
      description: Línea inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Credencial inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Recurso inexistente o inaccesible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Video no terminado o resultado aún no disponible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Gone:
      description: Recurso temporal vencido
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    NormalizedPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    CountJobCreateRequest:
      type: object
      required: [point_a, point_b]
      properties:
        point_a: { $ref: '#/components/schemas/NormalizedPoint' }
        point_b: { $ref: '#/components/schemas/NormalizedPoint' }
    CountJobAccepted:
      type: object
      required: [count_job_id, status, created_at, expires_at]
      properties:
        count_job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CountEvent:
      type: object
      required: [track_id, class_id, class_name, direction, frame_index, video_time_seconds]
      properties:
        track_id: { type: integer, minimum: 1 }
        class_id: { type: integer, minimum: 0 }
        class_name: { type: string, minLength: 1 }
        direction: { type: string, enum: [A_to_B, B_to_A] }
        frame_index: { type: integer, minimum: 0 }
        video_time_seconds: { type: number, minimum: 0 }
    CountSummaryItem:
      type: object
      required: [class_name, direction, total]
      properties:
        class_name: { type: string, minLength: 1 }
        direction: { type: string, enum: [A_to_B, B_to_A] }
        total: { type: integer, minimum: 0 }
    CountJobResponse:
      type: object
      required: [count_job_id, source_video_job_id, status, processed_frames, total_frames, progress_percent, events, summary, created_at, updated_at, expires_at]
      properties:
        count_job_id: { type: string, format: uuid }
        source_video_job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        processed_frames: { type: integer, minimum: 0 }
        total_frames: { type: integer, minimum: 1 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        events:
          type: array
          items: { $ref: '#/components/schemas/CountEvent' }
        summary:
          type: array
          items: { $ref: '#/components/schemas/CountSummaryItem' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        error: { $ref: '#/components/schemas/ErrorResponse' }
    CountEventPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CountEvent' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, format: uuid }

