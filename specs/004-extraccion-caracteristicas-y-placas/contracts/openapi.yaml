openapi: 3.1.0
info:
  title: Road Actor Detection API - Enrichment
  version: 4.0.0
  description: >-
    Trabajos temporales para extraer atributos visuales y analizar placas de
    detecciones existentes de imágenes o videos. Las matrículas son datos
    sensibles y solo se devuelven al propietario autenticado mientras el
    resultado está vigente.
servers:
  - url: /api
paths:
  /v1/enrichment-jobs:
    post:
      summary: Crea un trabajo temporal de enriquecimiento
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrichmentJobCreateRequest' }
      responses:
        '202':
          description: Trabajo aceptado sin esperar las inferencias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentJobAccepted' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/enrichment-jobs/{enrichmentJobId}:
    get:
      summary: Consulta estado y avance del trabajo
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EnrichmentJobId' }]
      responses:
        '200':
          description: Estado temporal del trabajo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentJobResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    delete:
      summary: Cancela un trabajo no terminal
      security: [{ ApiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EnrichmentJobId' }]
      responses:
        '202':
          description: Estado cancelado o solicitud de cancelación aceptada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichmentJobResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/enrichment-jobs/{enrichmentJobId}/results:
    get:
      summary: Lista resultados enriquecidos del propietario
      description: >-
        El campo plate.text aparece exclusivamente cuando plate.status es read.
        No se exponen rutas ni descargas públicas de recortes.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EnrichmentJobId'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Página de resultados temporales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichedVehiclePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    EnrichmentJobId:
      name: enrichmentJobId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    InvalidRequest:
      description: Fuente o solicitud inválida.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Credencial ausente o inválida.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Recurso inexistente o inaccesible.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Fuente no terminada, trabajo terminal o resultado no disponible.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Gone:
      description: Fuente o trabajo temporal vencido.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unavailable:
      description: Cola llena o componente de modelo no disponible.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    SourceReference:
      type: object
      required: [kind, source_id]
      properties:
        kind: { type: string, enum: [image, video] }
        source_id: { type: string, format: uuid }
    EnrichmentJobCreateRequest:
      type: object
      required: [source]
      properties:
        source: { $ref: '#/components/schemas/SourceReference' }
    EnrichmentJobAccepted:
      type: object
      required: [enrichment_job_id, status, created_at, expires_at]
      properties:
        enrichment_job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    EnrichmentJobResponse:
      type: object
      required:
        [enrichment_job_id, source, status, processed_units, total_units,
         progress_percent, created_at, updated_at, expires_at]
      properties:
        enrichment_job_id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/SourceReference' }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        processed_units: { type: integer, minimum: 0 }
        total_units: { type: integer, minimum: 0 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        results_ready: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: 'null'
    EnrichedVehiclePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EnrichedVehicleResult' }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    EnrichedVehicleResult:
      type: object
      required:
        [vehicle_key, class_id, class_name, detection_id, attributes_status,
         plate_status, attributes, plate]
      properties:
        vehicle_key:
          type: string
          description: Identificador temporal de detección o track, no identidad real.
        detection_id: { type: integer, minimum: 1 }
        track_id:
          anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
        class_id: { type: integer, minimum: 0 }
        class_name: { type: string, minLength: 1 }
        evidence_frame_indexes:
          type: array
          items: { type: integer, minimum: 0 }
        attributes_status: { type: string, enum: [completed, failed] }
        plate_status: { type: string, enum: [read, unreadable, not_detected, failed] }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/AttributeResult' }
        plate: { $ref: '#/components/schemas/PlateResult' }
        error_code:
          anyOf: [{ type: string }, { type: 'null' }]
    AttributeResult:
      type: object
      required: [name, label, confidence]
      properties:
        name: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence_frame_index:
          anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
    PlateResult:
      type: object
      required: [status, used_enhancement, evidence_frame_indexes]
      properties:
        status: { type: string, enum: [read, unreadable, not_detected, failed] }
        bbox_relative:
          anyOf: [{ $ref: '#/components/schemas/RelativeBoundingBox' }, { type: 'null' }]
        localizer_confidence:
          anyOf: [{ type: number, minimum: 0, maximum: 1 }, { type: 'null' }]
        ocr_confidence:
          anyOf: [{ type: number, minimum: 0, maximum: 1 }, { type: 'null' }]
        text:
          description: Dato sensible; solo está presente con estado read y para el propietario.
          anyOf: [{ type: string, minLength: 1 }, { type: 'null' }]
        used_enhancement: { type: boolean }
        evidence_frame_indexes:
          type: array
          items: { type: integer, minimum: 0 }
    RelativeBoundingBox:
      type: object
      required: [x_min, y_min, x_max, y_max]
      properties:
        x_min: { type: number, minimum: 0, maximum: 1 }
        y_min: { type: number, minimum: 0, maximum: 1 }
        x_max: { type: number, minimum: 0, maximum: 1 }
        y_max: { type: number, minimum: 0, maximum: 1 }
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, format: uuid }
