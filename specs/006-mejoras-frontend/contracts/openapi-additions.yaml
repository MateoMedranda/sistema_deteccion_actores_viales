openapi: 3.1.0
info:
  title: Road actor image exploration - proposed additions 006
  version: 0.1.0-plan
  description: Design overlay for existing API; not a replacement for its complete OpenAPI document.
paths:
  /api/v1/detections/{requestId}/original-image:
    get:
      operationId: getCanonicalOriginalImage006
      summary: Read the owned, unexpired canonical image
      security:
        - ApiKeyAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Canonical PNG, EXIF orientation applied and private metadata removed
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Unknown source or source owned by another principal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Expired:
      description: Expired source known to its authenticated owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    ImageResponseAdditions:
      description: Fields added to the existing DetectionResponse; preserve all existing fields.
      type: object
      required: [source_expires_at, original_image]
      properties:
        source_expires_at: { type: string, format: date-time }
        original_image:
          type: object
          required: [url, media_type, expires_at]
          properties:
            url: { type: string, format: uri-reference }
            media_type: { type: string, const: image/png }
            expires_at: { type: string, format: date-time }
    DetectionItemAdditions:
      description: Merge into each existing DetectionResponseItem; no fabricated track_id.
      type: object
      required: [enrichment_eligible]
      properties:
        enrichment_eligible: { type: boolean }
    EnrichmentReadiness006:
      description: Add capabilities to the existing health response; 200 only for ready, otherwise 503.
      type: object
      required: [status, capabilities]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        capabilities:
          type: object
          required: [attributes, plate_localization, plate_ocr]
          properties:
            attributes: { $ref: '#/components/schemas/CapabilityState' }
            plate_localization: { $ref: '#/components/schemas/CapabilityState' }
            plate_ocr: { $ref: '#/components/schemas/CapabilityState' }
    CapabilityState:
      type: string
      enum: [ready, unavailable]
