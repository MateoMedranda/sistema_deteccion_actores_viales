openapi: 3.1.0
info:
  title: Video 010 — adiciones opt-in
  version: 010-design
servers:
- url: /
paths:
  /api/v1/video-jobs/{job_id}/playback/capabilities:
    get:
      operationId: getVideoDetailCapabilities
      security:
      - ApiKey: []
      parameters:
      - &id001
        name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Capabilities
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
  /api/v1/video-jobs/{job_id}/playback/inspections:
    post:
      operationId: createVideoInspection
      security:
      - ApiKey: []
      parameters:
      - *id001
      responses:
        '202':
          description: Inspection
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Inspection
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.json#/$defs/InspectionRequest
  /api/v1/video-jobs/{job_id}/playback/inspections/{inspection_id}:
    get:
      operationId: getVideoInspection
      security:
      - ApiKey: []
      parameters:
      - *id001
      - &id002
        name: inspection_id
        in: path
        required: true
        schema: &id003
          type: string
          format: uuid
      responses:
        '200':
          description: Inspection
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Inspection
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
  /api/v1/video-jobs/{job_id}/playback/inspections/{inspection_id}/assets/{asset_id}/{kind}:
    get:
      operationId: getVideoInspectionAsset
      security:
      - ApiKey: []
      parameters:
      - *id001
      - *id002
      - name: asset_id
        in: path
        required: true
        schema: *id003
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - vehicle
          - plate
      responses:
        '200':
          description: PNG privado inmutable; no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
  /api/v1/video-jobs/{job_id}/playback/inspections/{inspection_id}/plate-preview:
    get:
      operationId: getVideoInspectionPlatePreview
      security:
      - ApiKey: []
      parameters:
      - *id001
      - *id002
      - name: profile
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: PNG privado del perfil visual con metadata inspection-plate-preview-v1;
            sin OCR ni IDs de imagen fabricados.
          headers:
            X-Plate-Preview-Metadata:
              description: JSON serializado de metadatos específicos de inspección;
                parser de video separado del de imágenes.
              content:
                application/json:
                  schema:
                    $ref: ./schemas.json#/$defs/InspectionPlatePreviewMetadata
          content:
            image/png:
              schema:
                type: string
                format: binary
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
  /api/v1/video-jobs/{job_id}/playback/directed-count:
    get:
      operationId: getDirectedCount
      security:
      - ApiKey: []
      parameters:
      - *id001
      - &id004
        name: generation
        in: query
        required: true
        schema: *id003
      - name: revision
        in: query
        required: false
        schema: &id005
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: at_us
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
      responses:
        '200':
          description: DirectedCount
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/DirectedCount
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
    put:
      operationId: applyDirectedCount
      security:
      - ApiKey: []
      parameters:
      - *id001
      responses:
        '200':
          description: DirectedCount
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/DirectedCount
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.json#/$defs/DirectedCountRequest
    delete:
      operationId: disableDirectedCount
      security:
      - ApiKey: []
      parameters:
      - *id001
      - *id004
      - name: expected_revision
        in: query
        required: true
        schema: *id005
      responses:
        '204':
          description: Desactivado
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
  /api/v1/video-jobs/{job_id}/playback/detection-summary:
    get:
      operationId: getDetectionSummary
      security:
      - ApiKey: []
      parameters:
      - *id001
      - *id004
      responses:
        '200':
          description: DetectionSummary
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/DetectionSummary
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
  /api/v1/video-jobs/{job_id}/playback/export:
    get:
      operationId: getLabelExportVariant
      security:
      - ApiKey: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
      - name: renderer
        in: query
        required: false
        schema:
          type: string
          enum:
          - vehicle-labels-v1
      responses:
        '200':
          description: LabelExportStatus
          content:
            application/json:
              schema:
                oneOf:
                - $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/VideoExportStatus
                - $ref: ./schemas.json#/$defs/LabelExportStatus
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
      description: Sin renderer conserva contrato legacy; renderer=vehicle-labels-v1
        activa exclusivamente la variante etiquetada.
    post:
      operationId: requestLabelExportVariant
      security:
      - ApiKey: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
      - name: renderer
        in: query
        required: false
        schema:
          type: string
          enum:
          - vehicle-labels-v1
      responses:
        '202':
          description: LabelExportStatus
          content:
            application/json:
              schema:
                oneOf:
                - $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/VideoExportStatus
                - $ref: ./schemas.json#/$defs/LabelExportStatus
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
      description: Sin renderer conserva contrato legacy; renderer=vehicle-labels-v1
        activa exclusivamente la variante etiquetada.
  /api/v1/video-jobs/{job_id}/playback/export/content:
    get:
      operationId: getLabelExportContent
      security:
      - ApiKey: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
      - name: renderer
        in: query
        required: true
        schema:
          type: string
          enum:
          - vehicle-labels-v1
      responses:
        '200':
          description: MP4 etiquetado privado y listo
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Range parcial protegido
        '416':
          description: Range inválido
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
    head:
      operationId: headLabelExportContent
      security:
      - ApiKey: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
      - name: renderer
        in: query
        required: true
        schema:
          type: string
          enum:
          - vehicle-labels-v1
      responses:
        '200':
          description: MP4 etiquetado privado y listo
        '206':
          description: Range parcial protegido
        '416':
          description: Range inválido
        default:
          description: Error seguro vigente; ver semántica por operación en README.
          content:
            application/json:
              schema:
                $ref: ../../009-video-progresivo/contracts/schemas.json#/$defs/Error
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
