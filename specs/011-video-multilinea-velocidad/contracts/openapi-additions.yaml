openapi: 3.1.0
info:
  title: Video011 multiline opt-in additions
  version: 011-design
servers:
- url: /
paths:
  /api/v1/video-jobs/{job_id}/playback/count-lines:
    get:
      operationId: getVideoCountLines
      security:
      - ApiKey: []
      parameters:
      - &id001
        name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
      - &id002
        name: generation
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Collection
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Collection
        default:
          description: Safe existing ApiError envelope; see README for exact conditions.
    put:
      operationId: putVideoCountLines
      security:
      - ApiKey: []
      parameters:
      - *id001
      responses:
        '200':
          description: Collection
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Collection
        default:
          description: Safe existing ApiError envelope; see README for exact conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.json#/$defs/CollectionWrite
  /api/v1/video-jobs/{job_id}/playback/count-lines/counts:
    get:
      operationId: getVideoCountLineCounts
      security:
      - ApiKey: []
      parameters:
      - *id001
      - *id002
      - name: revision
        in: query
        required: true
        schema: &id003
          type: integer
          minimum: 0
          maximum: 9007199254740991
      - name: at_us
        in: query
        required: true
        schema: *id003
      responses:
        '200':
          description: CountSnapshot
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/CountSnapshot
        default:
          description: Safe existing ApiError envelope; see README for exact conditions.
  /api/v1/video-jobs/{job_id}/playback/count-lines/import-legacy:
    post:
      operationId: importLegacyVideoCountLine
      security:
      - ApiKey: []
      parameters:
      - *id001
      responses:
        '200':
          description: Collection
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/$defs/Collection
        default:
          description: Safe existing ApiError envelope; see README for exact conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.json#/$defs/LegacyImport
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
